version: '3.3'
services:
  database:
    image: mysql:latest
    ports:
      - "3306:3306"
    volumes:
      - database:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=wordpress


  wordpress:
    depends_on:
      - database
    build: .
    ports:
      - "5000:80"
    environment:
      - WORDPRESS_DB_HOST=database:3306
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=root
      - SSH_HOST=2.4x0.net
      - SSH_PORT=2222
      - SSH_USERNAME=nytest
      - SSH_PASSWORD=passord

volumes:
  database:
