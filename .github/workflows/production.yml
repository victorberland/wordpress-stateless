name: Build and push to Scaleway registry - Production

on:
    push:
        branches: [master]
    schedule:
         - cron:  '0 2 * * *'
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Login to registry
        run: echo ${{ secrets.SCALEWAY_SECRET_KEY }} | docker login rg.fr-par.scw.cloud/4x0-net -u nologin --password-stdin
      - name: Build and tag the Docker image
        run: docker build -t rg.fr-par.scw.cloud/4x0-net/wordpress-serverless:latest .
      - name: Push the Docker image to the registry
        run: docker push rg.fr-par.scw.cloud/4x0-net/wordpress-serverless:latest
